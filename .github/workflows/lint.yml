name: lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 语法检查（AutoX.js 脚本）
        run: |
          for f in autojs/*.js; do
            echo "check $f"
            node --check "$f"
          done
      - name: 检查是否误提交个人数据
        run: |
          if git ls-files | grep -qE '地址巡检|\.csv$'; then
            echo "::error::仓库中不应包含运行产物或 CSV"; exit 1
          fi
          if git ls-files -z | xargs -0 grep -nE '1[3-9][0-9]{9}' -- 2>/dev/null | grep -v '1[3-9]\\d{9}'; then
            echo "::warning::检测到疑似手机号，请确认是示例还是真实数据"
          fi
